name: verify-ws-runtime-drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/ws-runtime.ts"
      - "server/ws-runtime-class-factory.ts"
      - "server/ws-runtime-class-factory-types.ts"
      - "shared/ws-close-codes.ts"
      - "tests/unit/ws-runtime-*.test.ts"
      - "tests/unit/server-ws-runtime.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/verify-ws-boundary-drill.yml"

jobs:
  ws_boundary_drill:
    strategy:
      matrix:
        node-version: ["22.x"]
    runs-on: ubuntu-latest
    name: ws-runtime-drill (node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run websocket runtime checks
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          bun run test:ws:runtime:decision 2>&1 | tee artifacts/ws-runtime-decision.log
          decision_status=${PIPESTATUS[0]}
          bun run test:ws:runtime:parity 2>&1 | tee artifacts/ws-runtime-parity.log
          parity_status=${PIPESTATUS[0]}
          set -e

          if [ "${decision_status}" -eq 0 ]; then decision_result="PASS"; else decision_result="FAIL"; fi
          if [ "${parity_status}" -eq 0 ]; then parity_result="PASS"; else parity_result="FAIL"; fi
          overall_status=0
          if [ "${decision_status}" -ne 0 ] || [ "${parity_status}" -ne 0 ]; then overall_status=1; fi

          cat > artifacts/ws-runtime-drill-summary.md <<EOF
          # Websocket Runtime Drill Summary

          - decision: ${decision_result} (exit=${decision_status})
          - parity: ${parity_result} (exit=${parity_status})
          - overall: $([ "${overall_status}" -eq 0 ] && echo PASS || echo FAIL)
          EOF

          cat > artifacts/ws-runtime-drill-summary.json <<EOF
          {
            "decisionExitCode": ${decision_status},
            "parityExitCode": ${parity_status},
            "passed": $([ "${overall_status}" -eq 0 ] && echo true || echo false)
          }
          EOF

          exit "${overall_status}"

      - name: Upload websocket runtime drill summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws-runtime-drill-summary-${{ github.run_id }}
          path: artifacts/ws-runtime-drill-summary.*
          if-no-files-found: warn
