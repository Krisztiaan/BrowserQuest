name: verify-ws-runtime-drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/ws-runtime-esm.ts"
      - "server/ws-runtime-class-factory.ts"
      - "server/ws-runtime-class-factory-types.ts"
      - "shared/ws-close-codes.ts"
      - "tests/unit/ws-runtime-*.test.ts"
      - "tests/unit/server-ws-esm.test.ts"
      - "tools/run-ws-boundary-drill.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/verify-ws-boundary-drill.yml"

jobs:
  ws_boundary_drill:
    strategy:
      matrix:
        node-version: ["22.x"]
    runs-on: ubuntu-latest
    name: ws-runtime-drill (node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run websocket boundary drill
        env:
          BQ_WS_DRILL_SUMMARY_PATH: artifacts/ws-runtime-drill-summary.json
          BQ_WS_DRILL_MARKDOWN_PATH: artifacts/ws-runtime-drill-summary.md
        run: bun run test:ws:runtime:drill

      - name: Upload websocket runtime drill summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws-runtime-drill-summary-${{ github.run_id }}
          path: artifacts/ws-runtime-drill-summary.*
          if-no-files-found: warn
