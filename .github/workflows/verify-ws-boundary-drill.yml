name: verify-ws-boundary-drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/js/ws.js"
      - "server/js/ws-esm.mjs"
      - "server/js/ws-runtime-esm.mjs"
      - "server/js/ws-runtime-class-factory.mjs"
      - "tests/unit/ws-runtime-*.test.ts"
      - "tests/unit/server-ws-esm.test.ts"
      - "tools/run-ws-boundary-drill.cjs"
      - "package.json"
      - "docs/websocket-*.md"
      - ".github/workflows/verify-ws-boundary-drill.yml"

jobs:
  ws_boundary_drill:
    strategy:
      matrix:
        node-version: ["22.x"]
    runs-on: ubuntu-latest
    name: ws-boundary-drill (node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run websocket boundary drill
        run: bun run test:ws:runtime:drill
