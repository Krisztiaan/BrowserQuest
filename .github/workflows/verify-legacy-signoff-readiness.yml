name: verify-legacy-signoff-readiness

on:
  workflow_dispatch:

jobs:
  signoff-readiness:
    strategy:
      matrix:
        node-version: ["22.x"]
    runs-on: ubuntu-latest
    name: legacy-signoff-readiness (node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture legacy signoff readiness report
        shell: bash
        run: |
          bun run check:legacy-signoff:report:json > legacy-signoff-readiness.json
          bun run check:legacy-signoff:report > legacy-signoff-readiness.txt 2>&1 || true

      - name: Summarize legacy signoff readiness
        shell: bash
        run: |
          node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('legacy-signoff-readiness.json','utf8')); const lines=[]; lines.push(report.ready ? '## Legacy signoff readiness: READY' : '## Legacy signoff readiness: BLOCKED'); lines.push(''); if (report.issues.length===0) { lines.push('- No blocking issues detected.'); } else { lines.push('- Blocking issues:'); for (const issue of report.issues) lines.push('  - '+issue); } fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');"

      - name: Upload signoff readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-signoff-readiness-${{ github.run_id }}
          path: |
            legacy-signoff-readiness.json
            legacy-signoff-readiness.txt
