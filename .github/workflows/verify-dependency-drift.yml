name: verify-dependency-drift

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  dependency-drift:
    strategy:
      matrix:
        node-version: ["22.x"]
    runs-on: ubuntu-latest
    name: dependency-drift (node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Capture dependency drift snapshot
        id: drift
        shell: bash
        run: |
          node tools/check-dependency-drift.cjs --allow-drift --text dependency-drift.txt --json dependency-drift.json
          drift_detected="$(node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('dependency-drift.json','utf8')); process.stdout.write(report.driftDetected ? 'true' : 'false');")"
          echo "drift_detected=${drift_detected}" >> "$GITHUB_OUTPUT"

      - name: Summarize dependency drift
        shell: bash
        run: |
          if [ "${{ steps.drift.outputs.drift_detected }}" = "true" ]; then
            echo "## Dependency drift detected" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Dependency drift clean" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat dependency-drift.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency drift artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-drift-${{ github.run_id }}
          path: |
            dependency-drift.txt
            dependency-drift.json
