name: verify-dependency-drift

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  dependency-drift:
    strategy:
      matrix:
        node-version: ["22.x"]
    runs-on: ubuntu-latest
    name: dependency-drift (node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Capture dependency drift snapshot
        id: drift
        shell: bash
        run: |
          bun outdated --no-progress > dependency-drift.txt
          drift_detected="$(
            awk -F'|' '
              /^\|/ {
                pkg=$2; cur=$3; upd=$4; latest=$5;
                gsub(/^[ \t]+|[ \t]+$/, "", pkg);
                gsub(/^[ \t]+|[ \t]+$/, "", cur);
                gsub(/^[ \t]+|[ \t]+$/, "", upd);
                gsub(/^[ \t]+|[ \t]+$/, "", latest);
                if (pkg != "" && pkg != "Package" && pkg !~ /^-+$/ && cur != "" && upd != "" && latest != "") {
                  found=1
                }
              }
              END { print found ? "true" : "false" }
            ' dependency-drift.txt
          )"
          echo "drift_detected=${drift_detected}" >> "$GITHUB_OUTPUT"

      - name: Summarize dependency drift
        shell: bash
        run: |
          if [ "${{ steps.drift.outputs.drift_detected }}" = "true" ]; then
            echo "## Dependency drift detected" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Dependency drift clean" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat dependency-drift.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency drift artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-drift-${{ github.run_id }}
          path: |
            dependency-drift.txt
