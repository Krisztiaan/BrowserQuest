name: verify-protocol-invariant

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "tests/browser/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/verify-protocol-invariant.yml"
  push:
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "tests/browser/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/verify-protocol-invariant.yml"

jobs:
  protocol-invariant:
    strategy:
      matrix:
        node-version: ["22.x"]
    runs-on: ubuntu-latest
    name: protocol-invariant (node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify protocol invariants
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: protocol-invariant-junit.xml
        run: bun run check:runtime && playwright test --config=playwright.config.ts tests/browser/protocol-invariant.playwright.ts --reporter=line,junit

      - name: Upload protocol invariant diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-invariant-diagnostics-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
